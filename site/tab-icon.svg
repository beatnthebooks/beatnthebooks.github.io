<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Beatn’ the Books logo">
  <defs>
    <linearGradient id="btb-arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8ccff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- the box (the books) -->
  <rect x="4" y="10" width="50" height="50" rx="12" fill="#13111c" stroke="#7c3aed" stroke-width="2.5"/>
  <!-- rising bars -->
  <rect x="13" y="38" width="8" height="14" rx="2" fill="#4c3a8f"/>
  <rect x="25" y="29" width="8" height="23" rx="2" fill="#6d4fd8"/>
