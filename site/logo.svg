<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Beatn’ the Books logo">
  <defs>
    <linearGradient id="btb-ball" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD66B"/>
      <stop offset=".55" stop-color="#F2B636"/>
      <stop offset="1" stop-color="#D98E12"/>
    </linearGradient>
    <linearGradient id="btb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16325A"/>
      <stop offset="1" stop-color="#0B1A30"/>
    </linearGradient>
    <clipPath id="btb-clip">
      <path d="M6 32C14 15.5 50 15.5 58 32C50 48.5 14 48.5 6 32Z" transform="rotate(-38 32 32)"/>
    </clipPath>
  </defs>
  <!-- badge -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#btb-bg)"/>
  <rect x="1.75" y="1.75" width="60.5" height="60.5" rx="14.25" fill="none" stroke="#F2B636" stroke-opacity=".35" stroke-width="1.5"/>
  <g transform="translate(32 32) scale(.84) translate(-32 -32)">
    <!-- football -->
    <path d="M6 32C14 15.5 50 15.5 58 32C50 48.5 14 48.5 6 32Z" transform="rotate(-38 32 32)" fill="url(#btb-ball)"/>
    <!-- end stripes -->
    <g clip-path="url(#btb-clip)" stroke="#0B1A30" stroke-width="3" opacity=".85">
      <path d="M14 23v18" transform="rotate(-38 32 32)"/>
      <path d="M50 23v18" transform="rotate(-38 32 32)"/>
    </g>
    <!-- laces as a rising chart line -->
    <path d="M19 41.5 27 35l5.5 4 9-11" fill="none" stroke="#0B1A30" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M37.5 27.5h5.2v5.2" fill="none" stroke="#0B1A30" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- stitches across the line -->
    <g stroke="#0B1A30" stroke-width="2.2" stroke-linecap="round">
      <path d="M21.6 36.6l2.6 2.9"/>
      <path d="M28.8 32.6l-1.2 3.6"/>
      <path d="M34.6 31.9l2.9 2.4"/>
    </g>
  </g>
</svg>
