name: Update site

# Rebuilds the Edge Board website from fresh nflverse data and wind forecasts,
# then publishes site/ to GitHub Pages. Runs in GitHub's cloud; no PC needed.

on:
  schedule:
    # UTC. In Central time: 7am, 10am, 1pm, 4pm, 7pm, 10pm (an hour earlier in winter).
    # GitHub can start scheduled runs a few minutes late.
    - cron: "0 0,3,12,15,18,21 * * *"
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: write           # to save data/wind_log.json back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests (a failure stops the deploy)
        run: python -m unittest discover -s tests

      - name: Rebuild with fresh data
        run: python weekly.py --fetch
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}     # optional; add under Settings → Secrets
          ODDS_BOOKS: ${{ vars.ODDS_BOOKS }}            # optional; e.g. draftkings,fanduel
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}         # optional; phone alerts (see alerts.py)

      - name: Save the logs (wind and odds freeze at kickoff; odds cache limits API use)
        run: |
          git config user.name "edge-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wind_log.json
          for f in data/odds_cache.json data/odds_log.json data/alerts_sent.json data/pick_log.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m "Update wind log"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
